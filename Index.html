<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Web Clone</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Circular / Inter-like font) -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* RESET & VARS */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    :root {
      --bg-black: #000000;
      --bg-base: #121212;
      --bg-surface: #181818;
      --bg-surface-hover: #282828;
      --bg-surface-active: #333333;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --spotify-green: #1ed760;
      --spotify-green-hover: #1fdf64;
      --player-height: 90px;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* APP LAYOUT */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - var(--player-height));
      padding: 8px;
      gap: 8px;
    }

    /* SIDEBAR */
    .sidebar {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-section, .library-section {
      background-color: var(--bg-base);
      border-radius: 8px;
      padding: 16px 20px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-primary);
    }

    .nav-item i {
      font-size: 1.4rem;
    }

    .library-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .library-header:hover {
      color: var(--text-primary);
    }

    .library-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .add-playlist-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      border-radius: 50%;
    }

    .add-playlist-btn:hover {
      color: var(--text-primary);
      background-color: rgba(255,255,255,0.1);
    }

    .playlist-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .playlist-item:hover {
      background-color: var(--bg-surface-hover);
    }

    .playlist-img {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      background: #282828;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .playlist-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .playlist-name {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-meta {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* MAIN CONTENT */
    .main-content {
      flex: 1;
      background-color: var(--bg-base);
      border-radius: 8px;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* TOP HEADER */
    .top-bar {
      position: sticky;
      top: 0;
      background-color: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(12px);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      width: 300px;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      color: var(--text-secondary);
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid transparent;
      padding: 10px 16px 10px 38px;
      border-radius: 50px;
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      transition: border 0.2s ease;
    }

    .search-input:focus {
      border-color: #ffffff;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: rgba(0,0,0,0.5);
      padding: 4px 12px 4px 4px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #535353;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CONTENT DISPLAY */
    .content-body {
      padding: 0 32px 32px;
    }

    .hero-banner {
      background: linear-gradient(180deg, rgba(83, 83, 83, 0.6) 0%, rgba(18, 18, 18, 0) 100%);
      margin: -16px -32px 24px;
      padding: 32px 32px 20px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .music-card {
      background: var(--bg-surface);
      padding: 16px;
      border-radius: 8px;
      transition: background 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .music-card:hover {
      background: var(--bg-surface-hover);
    }

    .card-img-container {
      position: relative;
      margin-bottom: 16px;
      aspect-ratio: 1;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border-radius: 6px;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-play-btn {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--spotify-green);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.3s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      border: none;
      cursor: pointer;
    }

    .music-card:hover .card-play-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .card-play-btn:hover {
      transform: scale(1.06);
      background-color: var(--spotify-green-hover);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    /* PLAYER BAR */
    .player-bar {
      height: var(--player-height);
      background-color: var(--bg-black);
      border-top: 1px solid #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: relative;
      z-index: 200;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 30%;
      min-width: 180px;
    }

    .now-playing-img {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      object-fit: cover;
    }

    .now-playing-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .now-playing-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-playing-artist {
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .like-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      margin-left: 8px;
    }

    .like-btn.active {
      color: var(--spotify-green);
    }

    /* PLAYER CONTROLS */
    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 40%;
      max-width: 720px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .control-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .control-btn:hover {
      color: var(--text-primary);
    }

    .control-btn.active {
      color: var(--spotify-green);
    }

    .play-pause-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: transform 0.1s ease;
    }

    .play-pause-btn:hover {
      transform: scale(1.08);
    }

    /* PROGRESS BAR */
    .progress-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .progress-bar-wrapper {
      flex: 1;
      height: 12px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background-color: #4d4d4d;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: #ffffff;
      border-radius: 2px;
    }

    .progress-bar-wrapper:hover .progress-fill {
      background-color: var(--spotify-green);
    }

    /* VOLUME CONTROLS */
    .volume-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      width: 30%;
      min-width: 180px;
    }

    .volume-bar-wrapper {
      width: 100px;
      height: 12px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .volume-bar {
      width: 100%;
      height: 4px;
      background-color: #4d4d4d;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .volume-fill {
      height: 100%;
      width: 70%;
      background-color: #ffffff;
      border-radius: 2px;
    }

    .volume-bar-wrapper:hover .volume-fill {
      background-color: var(--spotify-green);
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar {
      width: 12px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <nav class="nav-section">
        <ul class="nav-list">
          <li class="nav-item active"><i class="fa-solid fa-house"></i> Utama</li>
          <li class="nav-item"><i class="fa-solid fa-magnifying-glass"></i> Cari</li>
        </ul>
      </nav>

      <section class="library-section">
        <div class="library-header">
          <div class="library-title">
            <i class="fa-solid fa-book"></i> Koleksi Kamu
          </div>
          <button class="add-playlist-btn" id="addPlaylistBtn" title="Buat Playlist">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <div class="playlist-list" id="playlistList">
          <!-- Playlists rendered dynamically -->
        </div>
      </section>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- TOP NAVIGATION BAR -->
      <header class="top-bar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Apa yang ingin kamu dengarkan?">
        </div>
        <div class="user-profile">
          <div class="user-avatar">
            <i class="fa-solid fa-user"></i>
          </div>
          <span>Pengguna Spotify</span>
        </div>
      </header>

      <!-- CONTENT BODY -->
      <div class="content-body">
        <div class="hero-banner">
          <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 8px;">Selamat Datang</h1>
          <p style="color: var(--text-secondary); font-size: 0.9rem;">Dengarkan musik favoritmu kapan saja.</p>
        </div>

        <h2 class="section-title">Lagu Populer & Rekomendasi</h2>
        <div class="cards-grid" id="songsGrid">
          <!-- Track Cards rendered dynamically -->
        </div>
      </div>
    </main>
  </div>

  <!-- BOTTOM PLAYER BAR -->
  <footer class="player-bar">
    <!-- Now Playing Section -->
    <div class="now-playing">
      <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100&auto=format&fit=crop" id="playerImg" class="now-playing-img" alt="Cover">
      <div class="now-playing-info">
        <div class="now-playing-title" id="playerTitle">Pilih Lagu</div>
        <div class="now-playing-artist" id="playerArtist">Spotify Clone</div>
      </div>
      <button class="like-btn" id="likeBtn"><i class="fa-regular fa-heart"></i></button>
    </div>

    <!-- Central Player Controls -->
    <div class="player-controls">
      <div class="control-buttons">
        <button class="control-btn" id="shuffleBtn" title="Acak"><i class="fa-solid fa-shuffle"></i></button>
        <button class="control-btn" id="prevBtn" title="Sebelumnya"><i class="fa-solid fa-backward-step"></i></button>
        <button class="play-pause-btn" id="playPauseBtn" title="Putar">
          <i class="fa-solid fa-play" id="playIcon"></i>
        </button>
        <button class="control-btn" id="nextBtn" title="Berikutnya"><i class="fa-solid fa-forward-step"></i></button>
        <button class="control-btn" id="repeatBtn" title="Ulangi"><i class="fa-solid fa-repeat"></i></button>
      </div>

      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <div class="progress-bar-wrapper" id="progressWrapper">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <!-- Right Side Controls (Volume) -->
    <div class="volume-controls">
      <i class="fa-solid fa-volume-high" id="volumeIcon" style="color: var(--text-secondary); font-size: 0.9rem;"></i>
      <div class="volume-bar-wrapper" id="volumeWrapper">
        <div class="volume-bar">
          <div class="volume-fill" id="volumeFill"></div>
        </div>
      </div>
    </div>
  </footer>

  <!-- JAVASCRIPT CODE -->
  <script>
    // --- SAMPLE SONG DATA ---
    // (Menggunakan Audio Bebas Hak Cipta dari Mixkit/CDN)
    const songs = [
      {
        id: 1,
        title: "Live forever",
        artist: "oasis",
        cover: "image/image1.jpeg",
        url: "song/oasis-live forever.mp3"
      },
      {
        id: 2,
        title: "Saturn",
        artist: "Sza",
        cover: "image/image2.jpeg",
        url: "song/SZA - Saturn.mp3"
      },
      {
        id: 3,
        title: "Company",
        artist: "Justin Bieber",
        cover: "image/image3.jpeg",
        url: "song/Justin Bieber - Company.mp3"
      },
      {
        id: 4,
        title: "We Don't Talk Anymore ",
        artist: "Charlie Puth",
        cover: "image/gitaris tamora.jpeg",
        url: "Song/Charlie Puth - We Don't Talk Anymore (Lyrics) ft. Selena Gomez.mp3"
      },
      {
        id: 6,
        title: "Maher Zain - Paradise ",
        artist: "Maher Zain",
        cover: "image/bayanghytam.jpeg",
        url: "Song/Maher Zain - Paradise (Lyrics).mp3"
      },
      {
        id: 5,
        title: "Past Life",
        artist: "Ariana Grande",
        cover: "image/sniper batang kuis.jpeg",
        url: "song/Ariana Grande - past life (lyric visualizer).mp3"
      }
    ];

    // PLAYLISTS INITIAL STATE
    let playlists = [
      { id: 1, name: "Lagu Disukai", count: "10 lagu", icon: "fa-solid fa-heart" },
      { id: 2, name: "Favoritku", count: "Playlist • Sniper Batang Kuis", icon: "fa-solid fa-music" }
    ];

    // STATE VARIABLES
    let currentSongIndex = 0;
    let isPlaying = false;
    let isLiked = false;
    let audio = new Audio();

    // DOM ELEMENTS
    const songsGrid = document.getElementById('songsGrid');
    const playlistList = document.getElementById('playlistList');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playerImg = document.getElementById('playerImg');
    const playerTitle = document.getElementById('playerTitle');
    const playerArtist = document.getElementById('playerArtist');
    const progressWrapper = document.getElementById('progressWrapper');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const volumeWrapper = document.getElementById('volumeWrapper');
    const volumeFill = document.getElementById('volumeFill');
    const likeBtn = document.getElementById('likeBtn');
    const searchInput = document.getElementById('searchInput');
    const addPlaylistBtn = document.getElementById('addPlaylistBtn');

    // INITIALIZATION
    function init() {
      renderSongs(songs);
      renderPlaylists();
      loadSong(songs[currentSongIndex]);
      setupEventListeners();
    }

    // RENDER SONGS
    function renderSongs(songsToRender) {
      songsGrid.innerHTML = '';
      if(songsToRender.length === 0) {
        songsGrid.innerHTML = '<p style="color: var(--text-secondary);">Lagu tidak ditemukan.</p>';
        return;
      }

      songsToRender.forEach((song, index) => {
        const card = document.createElement('div');
        card.className = 'music-card';
        card.innerHTML = `
          <div class="card-img-container">
            <img src="${song.cover}" class="card-img" alt="${song.title}">
            <button class="card-play-btn" onclick="playSelectedSong(${song.id})">
              <i class="fa-solid fa-play"></i>
            </button>
          </div>
          <div class="card-title">${song.title}</div>
          <div class="card-desc">${song.artist}</div>
        `;
        songsGrid.appendChild(card);
      });
    }

    // RENDER PLAYLISTS
    function renderPlaylists() {
      playlistList.innerHTML = '';
      playlists.forEach(pl => {
        const item = document.createElement('div');
        item.className = 'playlist-item';
        item.innerHTML = `
          <div class="playlist-img">
            <i class="${pl.icon}"></i>
          </div>
          <div class="playlist-info">
            <div class="playlist-name">${pl.name}</div>
            <div class="playlist-meta">${pl.count}</div>
          </div>
        `;
        playlistList.appendChild(item);
      });
    }

    // LOAD SONG
    function loadSong(song) {
      playerTitle.textContent = song.title;
      playerArtist.textContent = song.artist;
      playerImg.src = song.cover;
      audio.src = song.url;
    }

    // PLAY SONG
    function playAudio() {
      isPlaying = true;
      audio.play();
      playIcon.className = 'fa-solid fa-pause';
    }

    // PAUSE SONG
    function pauseAudio() {
      isPlaying = false;
      audio.pause();
      playIcon.className = 'fa-solid fa-play';
    }

    // PLAY SELECTED SONG BY ID
    window.playSelectedSong = function(id) {
      const index = songs.findIndex(s => s.id === id);
      if(index !== -1) {
        currentSongIndex = index;
        loadSong(songs[currentSongIndex]);
        playAudio();
      }
    }

    // FORMAT TIME (SECONDS -> MM:SS)
    function formatTime(seconds) {
      if(isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // EVENT LISTENERS SETUP
    function setupEventListeners() {
      // Play / Pause Toggle
      playPauseBtn.addEventListener('click', () => {
        if(isPlaying) {
          pauseAudio();
        } else {
          playAudio();
        }
      });

      // Next Song
      nextBtn.addEventListener('click', () => {
        currentSongIndex = (currentSongIndex + 1) % songs.length;
        loadSong(songs[currentSongIndex]);
        playAudio();
      });

      // Previous Song
      prevBtn.addEventListener('click', () => {
        currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
        loadSong(songs[currentSongIndex]);
        playAudio();
      });

      // Audio Time Update
      audio.addEventListener('timeupdate', () => {
        const { currentTime, duration } = audio;
        if(duration) {
          const progressPercent = (currentTime / duration) * 100;
          progressFill.style.width = `${progressPercent}%`;
          currentTimeEl.textContent = formatTime(currentTime);
          totalTimeEl.textContent = formatTime(duration);
        }
      });

      // Auto Play Next on Song End
      audio.addEventListener('ended', () => {
        nextBtn.click();
      });

      // Seek Progress
      progressWrapper.addEventListener('click', (e) => {
        const width = progressWrapper.clientWidth;
        const clickX = e.offsetX;
        const duration = audio.duration;
        if(duration) {
          audio.currentTime = (clickX / width) * duration;
        }
      });

      // Volume Control
      volumeWrapper.addEventListener('click', (e) => {
        const width = volumeWrapper.clientWidth;
        const clickX = e.offsetX;
        const volume = clickX / width;
        audio.volume = Math.max(0, Math.min(1, volume));
        volumeFill.style.width = `${volume * 100}%`;
      });

      // Like Button Toggle
      likeBtn.addEventListener('click', () => {
        isLiked = !isLiked;
        if(isLiked) {
          likeBtn.classList.add('active');
          likeBtn.innerHTML = '<i class="fa-solid fa-heart"></i>';
        } else {
          likeBtn.classList.remove('active');
          likeBtn.innerHTML = '<i class="fa-regular fa-heart"></i>';
        }
      });

      // Search Filter Functionality
      searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filteredSongs = songs.filter(song => 
          song.title.toLowerCase().includes(term) || 
          song.artist.toLowerCase().includes(term)
        );
        renderSongs(filteredSongs);
      });

      // Add New Playlist Button
      addPlaylistBtn.addEventListener('click', () => {
        const newName = prompt('Masukkan nama playlist baru:', `Playlist Saya #${playlists.length + 1}`);
        if(newName) {
          playlists.push({
            id: Date.now(),
            name: newName,
            count: "0 lagu",
            icon: "fa-solid fa-music"
          });
          renderPlaylists();
        }
      });
    }

    // RUN ON LOAD
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
